name: Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Debian package and distributable
        run: ./gradlew :desktop:packageDeb :desktop:createDistributable
      - name: Download appimagetool
        run: |
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$RUNNER_TEMP/appimage-runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          APPIMAGETOOL_RUNTIME_FILE: ${{ runner.temp }}/appimage-runtime-x86_64
        run: ./scripts/package-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BookReader-linux
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/appimage/*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Windows installers
        run: .\gradlew.bat :desktop:packageMsi :desktop:packageExe
      - uses: actions/upload-artifact@v4
        with:
          name: BookReader-windows
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
